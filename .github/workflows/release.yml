name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    name: Build (${{ matrix.asset_name }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,  use_cross: true,  asset_name: msst-net-installer-linux-x86_64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest,  use_cross: true,  asset_name: msst-net-installer-linux-aarch64 }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest, use_cross: false, asset_name: msst-net-installer-windows-x86_64.exe }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest, use_cross: false, asset_name: msst-net-installer-windows-aarch64.exe }
          - { target: x86_64-apple-darwin,        os: macos-latest,   use_cross: false, asset_name: msst-net-installer-macos-x86_64 }
          - { target: aarch64-apple-darwin,       os: macos-latest,   use_cross: false, asset_name: msst-net-installer-macos-aarch64 }
    env:
      # Public keys of the Core and Controller repositories' release signing
      # keys (one each), built into the installer.
      MSST_CORE_RELEASE_PUBKEYS: ${{ vars.MSST_CORE_RELEASE_PUBKEYS }}
      MSST_CONTROLLER_RELEASE_PUBKEYS: ${{ vars.MSST_CONTROLLER_RELEASE_PUBKEYS }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the release public keys
        shell: bash
        run: |
          for v in MSST_CORE_RELEASE_PUBKEYS MSST_CONTROLLER_RELEASE_PUBKEYS; do
            test -n "${!v}" || { echo "set the $v repository variable" >&2; exit 1; }
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: matrix.use_cross
        with:
          tool: cross
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --locked --release --target ${{ matrix.target }}
      - name: Build (cargo)
        if: '!matrix.use_cross'
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: cp "target/${{ matrix.target }}/release/msst-net-installer" "${{ matrix.asset_name }}"
      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/msst-net-installer.exe" "${{ matrix.asset_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.asset_name }}

  # One license file covers every platform (about.toml lists the targets).
  # It fails if a dependency's license is not in about.toml's accepted list.
  licenses:
    name: Third-party licenses
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: THIRD-PARTY-LICENSES.txt

  # The build jobs fill a draft release; publish it only when every platform
  # built, so a half-filled release is never public.  The Gitee sync runs
  # after this, so Gitee never gets a half-filled release either.
  publish:
    name: Publish the release
    needs: [build, licenses]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Publish (a tag with a '-', e.g. v3.1.0-alpha.1, is a pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=$prerelease

  # Mirror only this run's release to Gitee: create it there if missing and
  # upload the assets it lacks, so a re-run is safe.
  sync-gitee:
    name: Sync the release to Gitee
    needs: [publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_API: https://gitee.com/api/v5/repos/Abjust/msst-net-installer-31x
      TAG: ${{ github.ref_name }}
    steps:
      - name: Sync
        run: |
          set -euo pipefail
          test -n "$GITEE_TOKEN" || { echo "set the GITEE_TOKEN secret" >&2; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json name,body,targetCommitish,isPrerelease > github.json
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets

          # A missing release answers 404 (or null), so look for an id.
          curl -sS -G "$GITEE_API/releases/tags/$TAG" --data-urlencode "access_token=$GITEE_TOKEN" > gitee.json
          id=$(jq -r '.id? // empty' gitee.json)
          if [ -z "$id" ]; then
            echo "Creating Gitee release $TAG"
            body=$(jq -r '.body // ""' github.json)
            curl -fsS -X POST "$GITEE_API/releases" \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "tag_name=$TAG" \
              --data-urlencode "name=$(jq -r '.name // ""' github.json | grep . || echo "$TAG")" \
              --data-urlencode "body=${body:--}" \
              --data-urlencode "target_commitish=$(jq -r .targetCommitish github.json)" \
              --data-urlencode "prerelease=$(jq -r .isPrerelease github.json)" > gitee.json
            id=$(jq -r .id gitee.json)
          fi

          for f in assets/*; do
            name=$(basename "$f")
            if jq -e --arg n "$name" 'any(.assets[]?; .name == $n)' gitee.json > /dev/null; then
              echo "$name is already on Gitee"
              continue
            fi
            echo "Uploading $name"
            for attempt in 1 2 3 4; do
              curl -fsS -X POST "$GITEE_API/releases/$id/attach_files" \
                -F "access_token=$GITEE_TOKEN" -F "file=@$f" > /dev/null && break
              [ "$attempt" -lt 4 ] || { echo "uploading $name failed" >&2; exit 1; }
              sleep 5
            done
          done
