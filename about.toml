# cargo-about configuration: `cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt`
# Where a crate offers a choice of licenses, the first acceptable one in this
# list is used, so MIT comes first.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

# Only the dependencies of the released targets.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

ignore-build-dependencies = false
ignore-dev-dependencies = true
